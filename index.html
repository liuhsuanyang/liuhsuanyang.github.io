<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>劉軒仰｜個人網站</title>
<meta name="description" content="劉軒仰（Liu Hsuan-Yang）的個人網站：經歷、學歷、證照、技能、專案與聯絡方式。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://liuhsuanyang.github.io/">
<meta property="og:title" content="劉軒仰｜個人網站">
<meta property="og:description" content="一座橋，一塊一塊砌起來。看看我的經歷、學歷、證照、技能與專案。">
<meta property="og:image" content="https://liuhsuanyang.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1A3A30">
<meta name="site-version" content="4.0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"TWKai";src:url(assets/kai.woff2) format("woff2");font-display:swap}
:root{--g:#1A3A30;--gold:#C9AB6E;--gold-ink:#7B6636;--sage:#98AFA5;--iv:#F3EFE6;--iv2:#EAE3D3;--ink:#1E2B26;--mut:#5B6B63;--line:#DDD5C5;--hero:#EDE8DC;--bar:76px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar) + 12px)}
body{margin:0;background:var(--iv);color:var(--ink);font:16px/1.8 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
.kai{font-family:"TWKai","Noto Serif TC",serif!important;font-weight:400!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font:500 15px/1.2 "Noto Sans TC",sans-serif;cursor:pointer;text-decoration:none;border:1px solid var(--gold);background:transparent;color:var(--gold)}
.btn svg{width:18px;height:18px;flex:none}
.btn.solid{background:var(--gold);color:var(--g)}
.btn:focus-visible,.pill:focus-visible,.icb:focus-visible,.acc .head:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.light .btn,.story .btn{color:var(--g);border-color:var(--g)}
.light .btn.solid,.story .btn.solid{background:var(--gold);border-color:var(--gold);color:var(--g)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.center{justify-content:center}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.hero{position:relative;background:var(--g);color:var(--hero);padding:calc(52px + env(safe-area-inset-top)) 0 30px;text-align:center}
.topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:6px}
.icb{width:40px;height:40px;border-radius:50%;border:1px solid rgba(237,232,220,.25);background:transparent;color:var(--hero);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icb .ico{width:19px;height:19px}
.logo{width:min(72%,280px);height:auto;display:block;margin:0 auto;overflow:visible}
.logo .s,.sb .w1,.sb .w0,.sb .gr,.logo .gr{fill:#2C5042}.logo .r,.sb .v{fill:#3A6553}.logo .c,.sb .cp{fill:#335A4A}.logo .k,.sb .key{fill:var(--gold)}
.name{font:400 clamp(46px,14vw,68px)/1.1 "TWKai","Noto Serif TC",serif;color:var(--gold);letter-spacing:.06em;margin:20px 0 0}
.en{font:600 12.5px/1 "Cinzel",serif;letter-spacing:.28em;color:var(--sage);margin:12px 0 0}
.tagline{font-size:16.5px;line-height:1.8;margin:20px auto 4px;max-width:26em;text-wrap:balance}
.headline{font-size:13.5px;color:var(--sage);margin:0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 14px;border-radius:999px;background:rgba(201,171,110,.14);color:var(--gold);font-size:13.5px}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cta{margin-top:22px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.pills.left{justify-content:flex-start}
.pill{display:inline-flex;align-items:center;border:1px solid rgba(201,171,110,.5);color:var(--hero);border-radius:999px;padding:6px 14px;font:500 13.5px/1.3 "Noto Sans TC",sans-serif;text-decoration:none;background:transparent;cursor:pointer}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.hint{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin-top:26px;color:var(--sage);font-size:13px;text-decoration:none}
.hint b{font-weight:400;font-size:18px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

.story{position:relative}
.sbar{position:sticky;top:0;z-index:5;background:var(--g);color:var(--hero);border-top:1px solid rgba(237,232,220,.08)}
.sbar-in{display:flex;align-items:center;gap:16px;height:var(--bar)}
.sb{width:168px;height:auto;flex:none;overflow:visible}
.slabel{min-width:0;display:flex;flex-direction:column;line-height:1.35}
#sNo{color:var(--gold);font-size:12px;letter-spacing:.12em}
#sTitle{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprog{height:2px;background:rgba(201,171,110,.18)}
.sprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}
@media (min-width:560px){.sb{width:200px}:root{--bar:88px}}
.js .sb .v,.js .sb .key,.js .sb .w0,.js .sb .cp{opacity:0;transform:translateY(-8px);transition:opacity .5s ease,transform .55s cubic-bezier(.2,.8,.2,1),fill .4s}
.js .sb .v.on,.sb.done .v{opacity:1;transform:none}
.sb .v{cursor:pointer}.sb .v.now{fill:#5A8A74}
.js .sb .key{transform:translateY(-26px)}
.sb.done .key{opacity:1;transform:none;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.sb.done .w0,.sb.done .cp{opacity:1;transform:none;transition-delay:.5s}
.sb .cen{fill:none;stroke:var(--sage);stroke-width:1;stroke-dasharray:2.4 2;opacity:.8;transition:opacity .6s .3s}
.sb.done .cen{opacity:0}

.ch{padding:52px 0 22px;min-height:34vh;scroll-margin-top:calc(var(--bar) + 8px)}
.ch.intro{min-height:0;padding:44px 0 6px}
.ch.intro p{font-size:17px;line-height:1.9;color:#3F4F48;margin:0;text-wrap:pretty}
.ch-no{margin:0;color:var(--gold-ink);font-size:13px;letter-spacing:.14em}
.ch-title,.sec h2{font:600 32px/1.3 "Noto Serif TC",serif;color:var(--g);margin:6px 0 10px}
.ch-title.kai,.sec h2.kai{font-size:36px}
.ch-lead{margin:0;color:#3F4F48;font-size:16.5px;max-width:32em}
.items{margin-top:22px;border-top:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line)}
.acc .head{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 2px;cursor:pointer}
.acc .head::-webkit-details-marker{display:none}
.acc.static .head{cursor:default}
.acc .hd{flex:1;min-width:0}
.acc .t{display:block;font-size:17px;font-weight:700;line-height:1.5}
.acc .o{display:block;font-size:14px;color:var(--mut);margin-top:1px}
.acc .chev{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold-ink);flex:none;transition:transform .25s ease,background .2s}
.acc .chev .ico{width:16px;height:16px}
.acc[open] .chev{transform:rotate(180deg);background:var(--iv2)}
.acc .bd{padding:0 2px 18px;animation:accIn .3s ease}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acc .per{margin:0;color:var(--gold-ink);font-size:13px}
.desc p{margin:6px 0 0;font-size:15.5px;line-height:1.8}
.acc .btn{margin-top:12px;padding:8px 16px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px;list-style:none;padding:0;margin:24px 0 0}
.chips li{background:var(--iv2);border-radius:999px;padding:6px 15px;font-size:15px}
.js .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.js .reveal.in{opacity:1;transform:none}
.keystone{text-align:center;min-height:0;padding:64px 0 60px}
.keystone .ch-lead{margin:0 auto}
.keystone .ch-lead p{margin:0 0 10px}
.ks-mark{width:46px;height:36px;margin:0 auto 12px;background:var(--gold);-webkit-clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
.photo{width:124px;height:124px;border-radius:50%;object-fit:cover;object-position:center 30%;border:3px solid var(--gold);display:block;margin:0 auto 18px}

.sec{padding:54px 0;border-top:1px solid var(--line)}
.sec.dark{border-top:0}
.note{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid button{padding:0;border:0;background:none;cursor:zoom-in;text-align:left;font:inherit;color:inherit}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;background:var(--iv2)}
.grid span{display:block;font-size:13px;color:var(--mut);margin-top:4px;line-height:1.5}
.vid{margin-top:18px}
.vid .fr{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid p{margin:8px 0 0;font-weight:500}
.quote{margin:18px 0 0;padding:18px 20px;background:#FBF9F4;border:1px solid var(--line);border-radius:14px}
.quote p{margin:0;font-size:15.5px}
.quote p:first-child:before{content:"「";color:var(--gold-ink)}
.quote p:last-of-type:after{content:"」";color:var(--gold-ink)}
.quote footer{background:none;padding:0;margin-top:10px;text-align:left;color:var(--mut);font-size:14px;border:0}
.faq details{border-top:1px solid var(--line);padding:4px 0}
.faq details:first-of-type{border-top:0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"＋";color:var(--gold-ink)}
.faq details[open] summary:after{content:"－"}
.faq .ans p{margin:0 0 12px;color:#3F4F48}
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.frame iframe{display:block;width:100%;height:480px;border:0}
.sec .btn{margin-top:14px}
.dark{background:var(--g);color:var(--hero)}
.dark h2{color:var(--gold)!important}
.dark .note{color:var(--sage)}
.dark .row{justify-content:flex-start}
.mailtext{margin:14px 0 0;color:var(--sage);user-select:all}
.foot{background:var(--g);color:var(--sage);font-size:12.5px;line-height:1.8;text-align:center;padding:10px 20px calc(30px + env(safe-area-inset-bottom));border-top:1px solid rgba(237,232,220,.08)}
.foot p{margin:2px 0}
.err{padding:48px 0;color:var(--mut);text-align:center}
.skip{position:absolute;left:-9999px;top:0}.skip:focus{left:12px;top:12px;z-index:9;background:var(--iv);padding:8px 12px;border-radius:8px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--iv);color:var(--ink);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center}
.mbox svg.qr{width:220px;height:220px;display:block;margin:6px auto 10px}
.mbox p{margin:0 0 14px;color:var(--mut);font-size:14px;word-break:break-all}
.mbox .row{justify-content:center}
.mbox .btn{color:var(--g);border-color:var(--g)}
.mbox .btn.solid{background:var(--gold);border-color:var(--gold)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:78vh;border-radius:8px}
.lb p{color:var(--hero);margin:12px 0 0;text-align:center}
.lb .icb{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g);color:var(--hero);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.js .reveal{opacity:1;transform:none}}
</style>
</head>

</header>

  $('#tagline').textContent=d.tagline||'';$('#headline').textContent=d.headline||'';
  if(d.status){$('#status').textContent=d.status;$('#status').hidden=false}
  $('#updated').textContent=String(d.updated||'').slice(0,10);$('#year').textContent=String(d.updated||'2026').slice(0,4);
  var c=d.contact||{},mail=email(c.emailEnc);
  $('#heroCta').appendChild(contactBlock(d,mail,true));

  var chs=(d.chapters||[]).filter(hasContent).slice(0,6);N=chs.length;
  var box=$('#chapters');box.textContent='';var titles=['往下滑，開始砌橋'];
  var intro=el('section','ch intro');intro.setAttribute('data-step','0');intro.appendChild(paras(d.intro));box.appendChild(intro);
  chs.forEach(function(ch,i){
    var s=el('section','ch');s.id='ch-'+(i+1);s.setAttribute('data-step',String(i+1));
    s.appendChild(el('p','ch-no',pad(i+1)+' / '+pad(N)));
    s.appendChild(kai(el('h2','ch-title',ch.title||'')));titles.push(ch.title||'');
    if(ch.lead)s.appendChild(el('p','ch-lead',ch.lead));
    if(ch.type==='tags'){var ul=el('ul','chips reveal');(ch.tags||[]).forEach(function(t){if(String(t).trim())ul.appendChild(el('li',null,t))});s.appendChild(ul)}
    else{var w=el('div','items');(ch.items||[]).forEach(function(it){w.appendChild(itemEl(it))});s.appendChild(w)}
    box.appendChild(s);
  });
  var k=d.keystone||{},ks=el('section','ch keystone');ks.id='keystone';ks.setAttribute('data-step',String(N+1));
  if(d.photo&&safeUrl(d.photo)){var img=el('img','photo reveal');img.src=d.photo;img.alt=name+'的照片';img.width=124;img.height=124;ks.appendChild(img)}else ks.appendChild(el('div','ks-mark reveal'));
  ks.appendChild(el('p','ch-no','拱心石'));
  ks.appendChild(kai(el('h2','ch-title',k.title||'最後放進去的那一塊')));titles.push(k.title||'拱心石');
  if(k.text)ks.appendChild(paras(k.text,'ch-lead'));
  box.appendChild(ks);
  steps=Array.prototype.slice.call(box.querySelectorAll('[data-step]'));
  buildBridge(Math.max(N,2));track(titles);

  var M=d.modules||{},w;
  var news=(d.news||[]).filter(function(x){return x.title||x.text});
  if(news.length){w=sec('news',(M.news||'最新動態'));var nb=el('div','items');news.forEach(function(x){nb.appendChild(itemEl({org:x.date,title:x.title,desc:x.text,link:x.link}))});w.appendChild(nb)}
  var gal=(d.gallery||[]).filter(function(x){return x.src&&safeUrl(x.src)});
  if(gal.length){w=sec('gallery',(M.gallery||'作品相簿'));var g=el('div','grid');gal.forEach(function(x){var b=el('button');b.type='button';var im=el('img');im.src=x.src;im.alt=x.caption||'作品照片';im.loading='lazy';b.appendChild(im);if(x.caption)b.appendChild(el('span',null,x.caption));b.onclick=function(){var lb=$('#lightbox');$('img',lb).src=x.src;$('img',lb).alt=x.caption||'';$('p',lb).textContent=x.caption||'';openM(lb)};g.appendChild(b)});w.appendChild(g)}
  var vids=(d.videos||[]).map(function(x){var m=String(x.url||'').match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?{id:m[1],title:x.title}:null}).filter(Boolean);
  if(vids.length){w=sec('videos',(M.videos||'影片'));vids.forEach(function(v){var f=el('div','vid reveal'),fr=el('div','fr'),ifr=document.createElement('iframe');ifr.src='https://www.youtube-nocookie.com/embed/'+v.id;ifr.title=v.title||'影片';ifr.loading='lazy';ifr.allow='accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';ifr.allowFullscreen=true;ifr.referrerPolicy='strict-origin-when-cross-origin';fr.appendChild(ifr);f.appendChild(fr);if(v.title)f.appendChild(el('p',null,v.title));w.appendChild(f)})}
  var tes=(d.testimonials||[]).filter(function(x){return x.quote});
  if(tes.length){w=sec('testimonials',(M.testimonials||'他們怎麼說'));tes.forEach(function(x){var q=el('blockquote','quote reveal');q.appendChild(paras(x.quote));var who=[x.name,x.role].filter(Boolean).join('，');if(who){var f=el('footer',null,'— '+who);q.appendChild(f)}w.appendChild(q)})}
  var faq=(d.faq||[]).filter(function(x){return x.q});
  if(faq.length){w=sec('faq',(M.faq||'常見問題'));faq.forEach(function(x){var dt=el('details'),sm=el('summary',null,x.q);dt.appendChild(sm);dt.appendChild(paras(x.a,'ans'));w.appendChild(dt)})}
  var cal=d.calendar||{},emb=cal.embed&&safeUrl(cal.embed),lnk=cal.link&&safeUrl(cal.link);
  if(emb&&!/^https:\/\/calendar\.google\.com\/calendar\/(u\/\d+\/)?embed\?/.test(emb))emb=null;
  if(emb||lnk){w=sec('calendar',cal.title||'我的時間');if(cal.note)w.appendChild(el('p','note',cal.note));
    if(emb){var u=new URL(emb);u.searchParams.set('mode',{week:'WEEK',month:'MONTH',agenda:'AGENDA'}[cal.view]||'WEEK');if(!u.searchParams.get('ctz'))u.searchParams.set('ctz','Asia/Taipei');['showPrint','showTitle','showCalendars'].forEach(function(p){if(!u.searchParams.has(p))u.searchParams.set(p,'0')});
      var fr=el('div','frame'),ifr=document.createElement('iframe');ifr.src=u.href;ifr.title=cal.title||'行事曆';ifr.loading='lazy';fr.appendChild(ifr);w.appendChild(fr)}
    if(lnk){var b=el('a','btn solid');b.href=lnk;b.target='_blank';b.rel='noopener';b.innerHTML=icon('cal');b.appendChild(document.createTextNode(cal.button||'預約時間'));w.appendChild(b)}}
  var fm=d.form||{},fu=fm.url&&safeUrl(fm.url);
  if(fu){w=sec('form',fm.title||'留言給我');if(fm.note)w.appendChild(el('p','note',fm.note));
    if(fm.embed&&/^https:\/\/docs\.google\.com\/forms\//.test(fu)){var eu=new URL(fu);eu.searchParams.set('embedded','true');var ff=el('div','frame'),fi=document.createElement('iframe');fi.src=eu.href;fi.title=fm.title||'表單';fi.loading='lazy';fi.style.height='640px';ff.appendChild(fi);w.appendChild(ff)}
    else{var fb=el('a','btn solid');fb.href=fu;fb.target='_blank';fb.rel='noopener';fb.innerHTML=icon('form');fb.appendChild(document.createTextNode(fm.button||'填寫表單'));w.appendChild(fb)}}

  var ct=sec('contact','聯絡我');ct.appendChild(el('p','note',(d.contactNote||'有任何合作、問題或只是想聊聊，都歡迎聯絡。')));
  ct.appendChild(contactBlock(d,mail,false));
  var rv=d.resume||{},ru=rv.file&&safeUrl(rv.file);
  var row=el('div','row');row.style.marginTop='22px';
  if(ru){var rb=el('a','btn solid');rb.href=ru;rb.target='_blank';rb.rel='noopener';rb.innerHTML=icon('down');rb.appendChild(document.createTextNode(rv.label||'下載我的履歷（PDF）'));row.appendChild(rb)}
  if(mail){var sh=el('button','btn','顯示 Email 地址');sh.type='button';sh.onclick=function(){sh.replaceWith(el('p','mailtext',mail))};row.appendChild(sh)}
  ct.appendChild(row);
  reveal();
}
fetch('content.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(e){var b=$('#chapters');b.textContent='';b.appendChild(el('p','err','內容載入失敗，請重新整理頁面。'));if(window.console)console.error(e)});
})();
</script>
</body>
</html>
